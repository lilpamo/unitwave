# Neural Latents Benchmark MC_Maze files (Churchland lab; DANDI 000128, 000138-000140):
# macaque M1 and PMd, two 96-channel Utah arrays, delayed center-out reaching through
# mazes. Checked on MC_Maze_Small, sub-Jenkins_ses-small_desc-train (DANDI 000140,
# version 0.220113.0408; docs/DECISIONS.md, "Step 7"). Read by unitwave/nwb/intake.py.
# Only the "train" files hold behaviour; the "test" files hold held-out trials.
name: nlb_mc_maze
label: Neural Latents Benchmark MC_Maze (macaque M1/PMd)
task: nlb_mc_maze

units:
  # A unit's array can't be told (below), so every unit is in one group.
  probe: single
  location:
    refused:
      reason: >-
        units.electrodes looks like per-array channel numbers: all 142 units point
        into the PMd array's rows (0-94), though both arrays recorded (PMd rows 0-95,
        M1 rows 96-191), so a unit's area can't be told
  depth:
    refused: Utah arrays have no depth along a shank
  # No quality column: unit QC is on spike times (configs/qc_spikes.yaml).

# Hand velocity is two channels (x, y; mm/s scaled to m/s by the file's conversion):
# its magnitude is the hand speed.
behaviour:
  hand_speed: {path: processing/behavior/hand_vel, combine: norm}

positions:
  refused: >-
    Utah arrays in a macaque: the electrodes have no coordinates (x, y, z are empty),
    and the Allen mouse atlas doesn't apply
